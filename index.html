<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>いまどこ powered by kinopye</title>
        <!--地図のCSS読み取り-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            /*画面余白の最小化*/
            body, html{
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
            }
            #app-container{
                position: relative;
                width: 100%;
                height: 100%;
            }
            /*地図の最大化*/
            #map{
                height: 100%;
                width: 100%;
            }
            /*地図上の半透明UI*/
            .overlay-panel{
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 1000;/*レイヤー最前面化*/
                background: rgba(255, 255, 255, 0.85);
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                font-family: sans-serif;
            }
            .overlay-panel h1{
                margin: 0 0 5px 0;
                font-size: 18px;
            }
            .overlay-panel p{
                margin: 0;
                font-size: 14px;
                color: #555;
            }
        </style>
    </head>
    <body>
        <div id="app-container">
            <!--地図上の半透明UI-->
            <div class="overlay-panel" id="overlay-panel">
                <h1>いまどこ powered by kinopye</h1>
                <p id="status">位置情報を読み込んでいます...</p>
            </div>
            <!--地図表示-->
            <div id="map"></div>
        </div>
        <!--Firebase読み込み-->
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
        <!--地図javascript読み込み-->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyCacuCNXs0Bl7VrMjGW0MHRAZzMSnoTmrs",
                authDomain: "imadoko-pye.firebaseapp.com",
                projectId: "imadoko-pye",
                storageBucket: "imadoko-pye.firebasestorage.app",
                messagingSenderId: "1022374725566",
                appId: "1:1022374725566:web:400d5d282d3c55b357dbef"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            var latLngList = []; //位置情報リスト
            var polyline = null; //経路表示の線

            db.collection("locations").doc("user1").onSnapshot((doc) => {
                if(doc.exists){
                    const data = doc.data();
                    const lat = data.latitude; //緯度
                    const lng = data.longitude; //経度

                    //届いた緯度・経度をリストに追加
                    const newPoint = [lat, lng];
                    latLngList.push(newPoint);

                    document.getElementById("status").innerText =
                    "位置情報を受信しました！(緯度: " + lat.toFixed(4) + ",経度: " +lng.toFixed(4) + ")";
                    polyline = L.polyline(latLngList, {color: 'red'}).addTo(map); //経路表示

                    //新しいポイントにピンを作成
                    L.circleMarker([lat, lng],{
                        radius: 8,
                        fillColor: "#00bfff",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5
                    }).addTo(map);
                    map.setView([lat, lng]); //地図をズーム
                }else{
                    document.getElementById("status").innerText = "位置情報が見つかりませんでした。";
                }
            })

            //地図の初期化
            var map = L.map('map',{
                zoom: 17, //初期ズームレベル
                zoomControl: false // デフォルトのズームコントロールを無効化
            });
            //地図拡大縮小ボタンの位置調整
            L.control.zoom({
                position: 'topright'
            }).addTo(map);
            //地図デザインの読み込み
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        </script>
    </body>
</html>
