<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>いまどこ powered by kinopye</title>
        <!--地図のCSS読み取り-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            /*画面余白の最小化*/
            body, html{
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
            }
            #app-container{
                position: relative;
                width: 100%;
                height: 100%;
            }
            /*地図の最大化*/
            #map{
                height: 100%;
                width: 100%;
            }
            /*地図上の半透明UI*/
            .overlay-panel{
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 1000;/*レイヤー最前面化*/
                background: rgba(255, 255, 255, 0.85);
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                font-family: sans-serif;
            }
            .overlay-panel h1{
                margin: 0 0 5px 0;
                font-size: 18px;
            }
            .overlay-panel p{
                margin: 0;
                font-size: 14px;
                color: #555;
            }
        </style>
    </head>
    <body>
        <div id="app-container">
            <!--地図上の半透明UI-->
            <div class="overlay-panel" id="overlay-panel">
                <h1>いまどこ powered by kinopye</h1>
                <p id="status">位置情報を読み込んでいます...</p>
            </div>
            <!--地図表示-->
            <div id="map"></div>
        </div>
        <!--Firebase読み込み-->
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
        <!--地図javascript読み込み-->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyCacuCNXs0Bl7VrMjGW0MHRAZzMSnoTmrs",
                authDomain: "imadoko-pye.firebaseapp.com",
                projectId: "imadoko-pye",
                storageBucket: "imadoko-pye.firebasestorage.app",
                messagingSenderId: "1022374725566",
                appId: "1:1022374725566:web:400d5d282d3c55b357dbef"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            var latLngList = []; //位置情報リスト
            var polyline = null; //経路表示の線

            //地図の初期化
            var map = L.map('map',{
                center: [35.6812, 139.7671], // 初期位置（東京駅など）
                zoom: 17, //初期ズームレベル
                zoomControl: false // デフォルトのズームコントロールを無効化
            });
            //地図拡大縮小ボタンの位置調整
            L.control.zoom({
                position: 'topright'
            }).addTo(map);
            //地図デザインの読み込み
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            db.collection("locations").document("user1").onSnapshot((doc) =>{
                if (!doc.exists) {
                    document.getElementById("status").innerText = "位置情報がまだありません。";
                    return;
                }

                const data = doc.data();
                const pathArray = data.path;

                if (!pathArray || pathArray.length === 0) {
                    document.getElementById("status").innerText = "位置情報がまだありません。";
                    return;
                }

                pathArray.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return timeA - timeB;
                });

                var latLngList = [];
                pathArray.forEach((data) => {
                    const lat = data.latitude;
                    const lng = data.longitude;
                    if (lat && lng) {
                        latLngList.push([lat, lng]);
                    }
                });

                if (latLngList.length > 0) {
                    const latest = latLngList[latLngList.length - 1];
                    const latestLat = latest[0];
                    const latestLng = latest[1];

                    document.getElementById("status").innerText =
                        "位置情報を受信しました。(緯度: " + latestLat.toFixed(4) + ", 経度: " + latestLng.toFixed(4) + ")";

                    // 既存の線をクリアして全軌跡を再描画
                    if (polyline) {
                        map.removeLayer(polyline);
                    }
                    polyline = L.polyline(latLngList, {color: 'red'}).addTo(map);

                    // 最新の位置にピン
                    L.circleMarker([latestLat, latestLng], {
                        radius: 8,
                        fillColor: "#00bfff",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5
                    }).addTo(map);

                    map.setView([latestLat, latestLng], 17);
                }
            });
    .where("userId", "==", "user1") 
    .onSnapshot((snapshot) => {
        if (snapshot.empty) {
            document.getElementById("status").innerText = "位置情報が見つかりませんでした。";
            return;
        }

        var docs = [];
        snapshot.forEach((doc) => {
            const data = doc.data();
            docs.push(data);
        });

        // タイムスタンプ順（古い順）に綺麗に並び替える
        docs.sort((a, b) => {
            const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
            const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
            return timeA - timeB;
        });

        var latLngList = [];
        docs.forEach((data) => {
            const lat = data.latitude;
            const lng = data.longitude;
            if (lat && lng) {
                latLngList.push([lat, lng]);
            }
        });
    });
        </script>
    </body>
</html>
