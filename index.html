<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>いまどこ powered by kinopye</title>
        <!--地図のCSS読み取り-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            /* 画面余白の最小化と高さの確保 */
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            /* 地図の最大化（絶対配置で確実に表示領域を確保） */
            #map {
                width: 100%;
                height: 100vh;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 1;
            }
            /* 地図上の半透明UI */
            .overlay-panel {
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 1000;
                background: rgba(255, 255, 255, 0.9);
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                font-family: sans-serif;
            }
            .overlay-panel h1 {
                margin: 0 0 5px 0;
                font-size: 18px;
            }
            .overlay-panel p {
                margin: 0;
                font-size: 14px;
                color: #555;
            }
        </style>
    </head>
    <body>
        <div class="overlay-panel">
            <h1>いまどこ powered by kinopye</h1>
            <p id="status">データを読み込んでいます...</p>
        </div>

        <!-- 地図表示エリア -->
        <div id="map"></div>

        <!-- Firebase読み込み -->
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
        <!-- 地図JavaScript読み込み -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyCacuCNXs0Bl7VrMjGW0MHRAZzMSnoTmrs",
                authDomain: "imadoko-pye.firebaseapp.com",
                projectId: "imadoko-pye",
                storageBucket: "imadoko-pye.firebasestorage.app",
                messagingSenderId: "1022374725566",
                appId: "1:1022374725566:web:400d5d282d3c55b357dbef"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            // 1. まず絶対に地図を初期化する（データがなくても東京駅中心で必ず表示される）
            const map = L.map('map', {
                zoom: 17,
                zoomControl: false
            });

            L.control.zoom({
                position: 'topright'
            }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            var polyline = null;
            var currentMarker = null;
            var allMarkers = [];

            // 2. user1 ドキュメントを監視して中の path 配列を取得
            db.collection("locations").doc("user1").onSnapshot((doc) => {
                if (!doc.exists) {
                    document.getElementById("status").innerText = "user1のデータがまだありません（アプリから送信が必要です）";
                    return;
                }

                const data = doc.data();
                const pathArray = data.path;

                if (!pathArray || pathArray.length === 0) {
                    document.getElementById("status").innerText = "軌跡データが空です";
                    return;
                }

                // タイムスタンプ順（古い順）に並び替え
                pathArray.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return timeA - timeB;
                });

                let latLngList = [];
                pathArray.forEach((point) => {
                    const lat = point.latitude;
                    const lng = point.longitude;
                    if (lat && lng) {
                        latLngList.push([lat, lng]);
                    }
                });

                if (latLngList.length > 0) {
                    const latest = latLngList[latLngList.length - 1];
                    const latestLat = latest[0];
                    const latestLng = latest[1];

                    document.getElementById("status").innerText =
                        "位置情報を受信しました！(緯度: " + latestLat.toFixed(4) + ", 経度: " + latestLng.toFixed(4) + ")";

                    // 既存の線をクリアして全軌跡を再描画
                    if (polyline) {
                        map.removeLayer(polyline);
                    }
                    polyline = L.polyline(latLngList, {color: 'red'}).addTo(map);

                    // 既存のマーカーをクリア
                    allMarkers.forEach(marker => map.removeLayer(m));
                    allMarkers = [];

                    pathArray.forEach((point, index) => {
                        const pLat = point.latitude;
                        const pLng = point.longitude;
                        if (pLat && pLng) {
                            const marker = L.circleMarker([pLat, pLng], {
                                radius: 6,
                                fillColor: "#00bfff",
                                color: "#ffffff",
                                weight: 1.5,
                                opacity: 0.9,
                                fillOpacity: 0.8
                            }).addTo(map);
                            allMarkers.push(marker);
                        }
                    });
                    map.setView([latestLat, latestLng], 17);
                }
            }, (error) => {
                document.getElementById("status").innerText = "エラー: " + error.message;
                console.error(error);
            });
        </script>
    </body>
</html>
